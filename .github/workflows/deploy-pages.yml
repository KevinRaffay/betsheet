# Deploy the at-the-track ticket builder to GitHub Pages (D154).
#
# WHAT GETS DEPLOYED IS ONE RACE DAY. `static/public/payload.json` is a
# committed file built by `npm run build-static-payload -- <raceDayId>`, so
# publishing a new payload is an ordinary commit and push, and it REPLACES the
# deployed race day. There is no per-day URL and no archive of past days: the
# app is a construction surface for the day you are at, not a corpus.
#
# The build is deliberately the only thing this workflow can do. It has no
# database, no secrets and no network access to anything but npm - every piece
# of race data it publishes was committed by a person who ran the payload
# builder at home.
#
# THIS DEPLOY CANNOT WORK UNTIL PAGES IS ENABLED ON THE REPOSITORY, and on a
# Free plan that means making the repository public (GitHub Pages from a
# private repository requires Pro/Team). Until then the workflow is here,
# correct, and will fail at the `deploy` job - which is the honest state,
# rather than a pipeline that silently does nothing.
#
# THE `build` JOB IS DELIBERATELY INDEPENDENT OF THAT. It installs, verifies
# and builds without asking GitHub anything about Pages, so it goes green on
# every push and gives a real CI signal today, months before a deploy can
# succeed. Only `deploy` touches Pages. That is why there is no
# `actions/configure-pages` step - see the note next to the artifact upload.
#
# NOTE, BEFORE ENABLING: a GitHub Pages site is PUBLICLY READABLE even when it
# is built from a private repository (private Pages needs Enterprise Cloud).
# Whatever is in payload.json is on the open internet at a guessable URL. Race
# entries are public information that Equibase already publishes; the day's own
# LLM and OTR picks are not, and `--reference-cards` puts them in the payload.
# Build the deployed payload WITHOUT that flag unless publishing those picks is
# a deliberate choice.

name: Deploy static ticket builder

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      # The payload is the race day, so a payload commit is a deploy.
      - 'static/**'
      - 'shared/**'
      # The two desktop components the static app reuses rather than forking.
      - 'client/src/components/TicketBuilder.jsx'
      - 'client/src/components/EntriesTable.jsx'
      - 'client/src/styles.css'
      - 'vite.static.config.js'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/deploy-pages.yml'

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time, and never cancel one in flight: a half-replaced Pages
# site is a race day nobody can build against.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 24, matching the machine the check suites are developed and run on,
      # and the only line here that is not free to drift. `better-sqlite3@13`
      # requires node >=22 and `pdfjs-dist@6` >=22.13 - and npm treats an
      # engine mismatch as a WARNING, so `npm ci` "succeeds", installs a
      # native binding built for a different ABI, and the first `require` of
      # it SEGFAULTS. That is exactly how this workflow failed on its first
      # run: exit 139 two seconds in, with no check output at all to say why.
      # `engines.node` in package.json now declares the same floor.
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Node satisfies what the dependencies declare
        # Belt and braces for the failure above: npm only warns, so this turns
        # a wrong runtime into a one-line error instead of a segfault in a
        # later step that looks like a broken check.
        run: |
          node --input-type=module -e "
            import fs from 'node:fs';
            const want = JSON.parse(fs.readFileSync('package.json', 'utf8')).engines?.node ?? '';
            const floor = (want.match(/(\d+)\.(\d+)/) ?? [, '22', '13']).slice(1).map(Number);
            const [major, minor] = process.versions.node.split('.').map(Number);
            const ok = major > floor[0] || (major === floor[0] && minor >= floor[1]);
            if (!ok) { console.error(\`::error::node \${process.version} is below the project's engines.node (\${want})\`); process.exit(1); }
            console.log(\`node \${process.version} satisfies engines.node \${want}\`);
          "

      - name: Refuse to deploy without a race day
        # An empty deploy is worse than no deploy: the app would load at the
        # track and report that no race day is published, with no way to fix it
        # from there.
        run: |
          test -f static/public/payload.json \
            || { echo "::error::static/public/payload.json is missing. Run: npm run build-static-payload -- <raceDayId>"; exit 1; }
          node --input-type=module -e "
            import fs from 'node:fs';
            import { validateStaticPayload } from './shared/static-payload.js';
            const p = JSON.parse(fs.readFileSync('static/public/payload.json', 'utf8'));
            const problems = validateStaticPayload(p);
            if (problems.length) { console.error('::error::payload.json is not valid:\n- ' + problems.join('\n- ')); process.exit(1); }
            console.log(\`Deploying \${p.raceDay.track} \${p.raceDay.date} (race day \${p.raceDay.raceDayId}), \${p.races.length} races, \${p.payloadHash}\`);
            if (p.referenceCards) console.log('::warning::This payload embeds reference cards, which will be publicly readable.');
          "

      - name: Verify the bundle ships no generator code
        # The same check-static-app that runs locally, as the deploy gate:
        # "no LLM or OTR generation in the bundle" is a hard constraint, and a
        # constraint nothing enforces at deploy time is a comment.
        run: npm run check-static-app

      - name: Build
        env:
          # D154's Pages base. vite.static.config.js defaults to a relative
          # base for local builds; this is where the deployed sub-path is set.
          BETSHEET_STATIC_BASE: /betsheet/
        run: npm run build:static

      # NO `actions/configure-pages` step. Its only job is to report the Pages
      # site's base path back to a static-site generator, and this build does
      # not ask - `BETSHEET_STATIC_BASE` above sets the base explicitly, which
      # is also what `check-static-app` asserts against. Keeping it would mean
      # a step whose outputs are ignored, and which FAILS when Pages is not
      # yet enabled - dragging the whole build job down with a deployment
      # problem it has nothing to do with. Uploading the artifact needs no
      # such call; only `deploy-pages` below genuinely requires Pages.
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist-static

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
